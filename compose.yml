services:
  db:
    image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
    environment:
      POSTGRES_DB: mdm
      POSTGRES_USER: mdm
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mdm_dev_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["mdm-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdm -d mdm"]
      interval: 2s
      retries: 20
volumes:
  mdm-data:
