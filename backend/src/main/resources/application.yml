server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mdm}
    username: ${DATABASE_USER:mdm}
    password: ${DATABASE_PASSWORD:mdm_dev_only}
    hikari:
      maximum-pool-size: 16
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
mdm:
  retry-delays: ${RETRY_DELAYS:60,300,1800,7200}
  worker-delay: ${WORKER_DELAY:1000}
  source-destinations: ${SOURCE_DESTINATIONS:jdbc:postgresql://localhost:5432/mdm_erp_v3;http://127.0.0.1:9092;http://localhost:9092}
  credential-bindings: ${CREDENTIAL_BINDINGS:*|ERP_READ_USER|jdbc:postgresql://localhost:5432/mdm_erp_v3;*|ERP_READ_PASSWORD|jdbc:postgresql://localhost:5432/mdm_erp_v3}
  writeback-workers: ${WRITEBACK_WORKERS:true}
  scan-workers: ${SCAN_WORKERS:true}
